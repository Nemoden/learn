# DevCollab Platform - Docker Compose Setup
# Services are added progressively as you complete sprints

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # Databases (Sprint 0 - available from day 1)
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: devcollab-postgres
    environment:
      POSTGRES_DB: devcollab
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devcollab"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: devcollab-valkey
    ports:
      - "6379:6379"
    command: valkey-server --requirepass redispass123
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

